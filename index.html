<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/folio.svg" />
    <title>Folio</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("folio.theme");
          var pref = raw ? JSON.parse(raw) : "system";
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
        if (window.__TAURI_INTERNALS__) document.documentElement.setAttribute("data-tauri", "");
        if (/[?&]still=1/.test(location.search)) document.documentElement.setAttribute("data-still", "");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
